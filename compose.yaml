services:
  news-radio:
    build:
      context: .
      target: runtime
    image: ${NEWS_RADIO_IMAGE:-news-radio:0.1.0}
    init: true
    user: "${NEWS_RADIO_UID:-1000}:${NEWS_RADIO_GID:-1000}"
    environment:
      NEWS_RADIO_DATA_DIR: /app/data
      NEWS_RADIO_LOG_LEVEL: ${NEWS_RADIO_LOG_LEVEL:-INFO}
      NEWS_RADIO_CONFIG_DIR: /app/config
      NEWS_RADIO_REFRESH_SECONDS: ${NEWS_RADIO_REFRESH_SECONDS:-1800}
      NEWS_RADIO_REDDIT_INTERVAL_SECONDS: ${NEWS_RADIO_REDDIT_INTERVAL_SECONDS:-7200}
      NEWS_RADIO_REDDIT_REQUEST_GAP_SECONDS: ${NEWS_RADIO_REDDIT_REQUEST_GAP_SECONDS:-1800}
      NEWS_RADIO_REDDIT_COOLDOWN_SECONDS: ${NEWS_RADIO_REDDIT_COOLDOWN_SECONDS:-21600}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-hf.co/lmstudio-community/gemma-4-E2B-it-GGUF:Q4_K_M}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      OLLAMA_KEEP_ALIVE: 0
      AI_RUNTIME_LOCK: /run/local-ai/inference.lock
      SEARXNG_URL: ${SEARXNG_URL:-http://192.168.1.9:8888}
      SEARXNG_GENERAL_ENGINES: ${SEARXNG_GENERAL_ENGINES:-}
      SEARXNG_NEWS_ENGINES: ${SEARXNG_NEWS_ENGINES:-}
      SEARXNG_FALLBACK_ENGINES: ${SEARXNG_FALLBACK_ENGINES-bing}
      WEB_DIR: /app/web
    ports:
      - "${NEWS_RADIO_PORT:-8790}:8790"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ../.ai-runtime:/run/local-ai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    restart: unless-stopped
