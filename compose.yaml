x-runtime: &runtime
  image: news-orchestrator:0.1.0
  init: true
  user: "1000:1000"
  environment: &runtime-environment
    DATA_DIR: /app/data
    CONFIG_DIR: /app/config
    WEB_DIR: /app/web
    NEWS_RADIO_URL: http://127.0.0.1:8790
    QWENTTS_URL: http://127.0.0.1:8791
  volumes:
    - ./data:/app/data
    - ./config:/app/config:ro
  network_mode: host
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"
services:
  orchestrator:
    <<: *runtime
    build: .
    cpus: 1.0
    mem_limit: 512m
    environment:
      <<: *runtime-environment
      AI_RUNTIME_LOCK: /run/local-ai/inference.lock
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ../.ai-runtime:/run/local-ai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8792/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  broadcaster:
    <<: *runtime
    command: ["python", "-m", "news_orchestrator.broadcast"]
    cpus: 0.5
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time; from pathlib import Path; p=Path('/app/data/broadcast.json'); assert p.exists() and time.time()-p.stat().st_mtime<30"]
      interval: 30s
      timeout: 5s
      retries: 3
  youtube:
    <<: *runtime
    command: ["python", "-m", "news_orchestrator.youtube"]
    cpus: 0.5
    mem_limit: 192m
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-c", "import json; from news_orchestrator.youtube_control import DIRECTORY,age; s=json.loads((DIRECTORY/'status.json').read_text()); assert age(s['updated_at'])<15"]
      interval: 15s
      timeout: 5s
      retries: 3
