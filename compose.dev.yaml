# Optional source mounts. Uses the same bridge network and persistent state.
services:
  news-radio:
    volumes:
      - ./services/news-radio/src:/app/src:ro
      - ./services/news-radio/web:/app/web:ro
  orchestrator:
    volumes:
      - ./services/orchestrator/src:/app/src:ro
      - ./services/orchestrator/web:/app/web:ro
  broadcaster:
    volumes:
      - ./services/orchestrator/src:/app/src:ro
  youtube:
    volumes:
      - ./services/orchestrator/src:/app/src:ro
  qwentts:
    volumes:
      - ./services/qwentts/src:/app/src:ro
      - ./services/qwentts/web:/app/web:ro
